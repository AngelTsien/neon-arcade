function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';x.setTransform(d,0,0,d,0,0);st=[...Array(Math.min(120,W/10|0))].map(()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.4+.3,p:Math.random()*7}))}rs();addEventListener('resize',rs);
const BL=[['#8b7bff',.35,.2,.3],['#ff6ad5',.22,.8,.25],['#3fd8ff',.2,.5,.8],['#ffcf5c',.08,.15,.85]];
(function f(t){requestAnimationFrame(f);if(document.hidden)return;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
 BL.forEach(([c,a,bx,by],i)=>{const X=W*(bx+.08*Math.sin(t/7000+i*2)),Y=H*(by+.06*Math.cos(t/9000+i)),R=Math.max(W,H)*.45;const g=x.createRadialGradient(X,Y,0,X,Y,R);const h=c.match(/\w\w/g).map(v=>parseInt(v,16)).join(',');g.addColorStop(0,`rgba(${h},${a})`);g.addColorStop(1,`rgba(${h},0)`);x.fillStyle=g;x.fillRect(0,0,W,H)});
 x.globalCompositeOperation='source-over';st.forEach(s=>{x.fillStyle=`rgba(255,255,255,${.25+.45*Math.sin(t/900+s.p)**2})`;x.fillRect(s.x,s.y,s.s,s.s)})})(0);
</script></body></html>
