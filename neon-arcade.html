const CATS=['全部',...new Set(GAMES.map(g=>g[6]))];let cat='全部';
const g=document.getElementById('g'),fb=document.getElementById('filters');
function bestOf(d,keys){if(keys)return keys.map(([l,k,f])=>{const b=+localStorage.getItem('hub_best_'+k)||0;return l+' '+(b?f(b):'—')}).join(' · ');const b=+localStorage.getItem('hub_best_'+d)||0;return b?'最佳 '+b:'尚未挑战'}
function render(){g.innerHTML='';let i=0;GAMES.forEach(([d,n,ic,desc,c,c2,tag,keys])=>{if(cat!=='全部'&&tag!==cat)return;const a=document.createElement('a');a.className='card';a.href=d+'/index.html';a.style.cssText=`--c:${c};--c2:${c2};animation-delay:${(i++)*.04}s`;
 a.innerHTML=`<div class="ic">${ic}</div><h2>${n}</h2><p>${desc}</p><div class="meta"><span class="best">${bestOf(d,keys)}</span><span class="tag">${tag}</span></div>`;g.appendChild(a)});
 fb.innerHTML=CATS.map(k=>`<button class="${k===cat?'on':''}" data-c="${k}">${k} ${k==='全部'?GAMES.length:GAMES.filter(q=>q[6]===k).length}</button>`).join('')}
fb.onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;sessionStorage.setItem('hub_cat',c);render()}};cat=sessionStorage.getItem('hub_cat')||'全部';if(!CATS.includes(cat))cat='全部';render();
document.getElementById('clr').onclick=()=>{if(confirm('确定清除所有游戏的最高分记录？')){Object.keys(localStorage).filter(k=>k.startsWith('hub_best_')).forEach(k=>localStorage.removeItem(k));location.reload()}};

const cv=document.getElementById('bg'),x=cv.getContext('2d');let W,H,pts;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=[...Array(Math.min(90,W/14|0))].map(()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}rs();addEventListener('resize',rs);
(function f(t){requestAnimationFrame(f);x.fillStyle='#05050f';x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(255,0,230,.12)';const hy=H*.62,o=(t/30)%50;for(let i=0;i<12;i++){const y=hy+Math.pow(i+o/50,2)*6;if(y>H)break;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
 for(let i=-20;i<=20;i++){x.beginPath();x.moveTo(W/2+i*30,hy);x.lineTo(W/2+i*220,H);x.stroke()}
 pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
 for(let i=0;i<pts.length;i++){const a=pts[i];x.fillStyle='rgba(0,240,255,.6)';x.fillRect(a.x,a.y,2,2);for(let j=i+1;j<pts.length;j++){const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){x.strokeStyle=`rgba(0,240,255,${.15*(1-d/120)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}})(0);
